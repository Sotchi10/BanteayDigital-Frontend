<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Banteay Digital logo</title>
  <desc id="desc">A blue rounded-square logo with an interlocking white and cyan architectural B monogram.</desc>

  <defs>
    <radialGradient id="tile" cx="50%" cy="48%" r="68%">
      <stop offset="0" stop-color="#1048a7"/>
      <stop offset="0.56" stop-color="#073783"/>
      <stop offset="1" stop-color="#03245e"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#65baff"/>
      <stop offset="1" stop-color="#4399f1"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f8fb"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Transparent outside the rounded tile. -->
  <rect x="18" y="27" width="1218" height="1170" rx="255" fill="url(#tile)"/>
  <ellipse cx="625" cy="600" rx="450" ry="480" fill="#0d4ead" opacity="0.16" filter="url(#softGlow)"/>

  <!-- Upper architectural mark. -->
  <path fill="url(#white)" d="M231 270 308 226v78l61-34v-73l92-52v222L231 479Z"/>
  <path fill="url(#cyan)" d="m461 145 82 45v80l59 31v-80l76 40v182l-217-76Z"/>

  <!-- Middle beam and left pillar. -->
  <path fill="url(#white)" d="m231 518 230-107v136l-125 60v417H231Z"/>
  <path fill="url(#cyan)" d="m461 411 217 69v67H461Z"/>

  <!-- Lower architectural details. -->
  <path fill="url(#white)" d="m378 630 86-38h115v62H473v109l-95-22Z"/>
  <path fill="url(#white)" d="m378 785 95 22v217h-95Z"/>
  <path fill="url(#white)" d="m527 817 126 32v175H527Z"/>
  <path fill="url(#cyan)" d="M579 592h99v126h145v94H672l-145-37v-57h52Z"/>

  <!-- Large B. -->
  <path fill="url(#cyan)" d="M712 266h93c135 0 230 79 230 189 0 64-31 112-84 146 77 39 124 103 124 191 0 132-106 232-249 232H695V898h124c73 0 120-42 120-110 0-70-51-117-123-117H712V546h105c49 0 79-31 79-79 0-46-32-80-81-80H712Z"/>
</svg>
